apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: argocd
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: github-app
    creationPolicy: Owner

  data:
    - secretKey: github_app.json
      remoteRef:
        key: argocd/dev/github-app
        property: github-app