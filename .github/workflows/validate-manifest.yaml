name: validate workfloww

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      helm_chart: ${{ steps.extract.outputs.services }}
      helm_chart_changed: ${{ steps.extract.outputs.services_changed }}

    steps:
      - uses: actions/checkout@v4
        with:

          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            helm_chart:
              - 'helm-chart/**'
            github_file:
              - '.github/workflows/validate-manifest.yaml'

      - id: extract
        shell: bash
        run: |
          set -euo pipefail

          HELM_FILES="${{ steps.filter.outputs.helm_chart_files }}"
          GITHUB_FILES="${{ steps.filter.outputs.github_file_files }}"

          if [[ -n "$HELM_FILES" ]]; then
            SERVICES=$(
              echo "$HELM_FILES" |
              tr ' ' '\n' |
              cut -d/ -f2 |
              sort -u |
              jq -Rsc 'split("\n") | map(select(length>0))'
            )

           elif [[ -n "$GITHUB_FILES" ]]; then
              SERVICES=$(
                find helm-chart \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -printf "%f\n" |
                jq -Rsc 'split("\n") | map(select(length > 0))'
              )
            else
              SERVICES="[]"
            fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          if [[ "$SERVICES" == "[]" ]]; then
            echo "services_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "services_changed=true" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # yaml-lint:
  #   runs-on: ubuntu-latest
  #   needs: detect-changes

  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: ibiqlik/action-yamllint@v3
  #       with:
  #         file_or_dir: .


  k8s-scan:
    name: K8s manifest scan
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes
          soft_fail: true
          output_format: cli

  helm-check:
    name: Check helm configuration
    needs: detect-changes
    if: needs.detect-changes.outputs.helm_chart_changed == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.helm_chart) }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - run: |
          KUBECONFORM_VERSION="0.7.0"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      
      - name: Cache Helm
        uses: actions/cache@v4
        with:
          path: ~/.cache/helm
          key: helm-${{ runner.os }}-${{ hashFiles('helm-chart/**/Chart.lock') }}
          restore-keys: |
            helm-${{ runner.os }}-

      - name: Validate Helm Chart
        working-directory: helm-chart/${{ matrix.chart }}
        shell: bash
        run: |
          set -euo pipefail

          helm dependency build .
          helm lint .

          if compgen -G "values*.yaml" > /dev/null; then
            for values in values*.yaml; do
              echo "Validating $values"

              helm template test . -f "$values" \
                | kubeconform \
                    -strict \
                    -ignore-missing-schemas
            done
          else
            helm template test . \
              | kubeconform \
                  -strict \
                  -ignore-missing-schemas
          fi